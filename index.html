<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Game Asset Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 1100px; margin: auto; }
        .header { margin-bottom: 2rem; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: white; }
        
        #drop-zone { border: 2px dashed #334155; border-radius: 12px; padding: 40px; cursor: pointer; transition: 0.3s; background: var(--card); }
        #drop-zone:hover { border-color: var(--primary); background: #2d3748; }

        .controls { margin-top: 20px; display: none; }
        button { background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button#zip-btn { background: #10b981; margin-left: 10px; }

        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 2rem; }
        .asset-card { background: var(--card); border-radius: 8px; padding: 10px; text-align: center; font-size: 12px; }
        .asset-card img { width: 100%; height: 120px; object-fit: contain; background: #334155; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 Game Asset Deep-Extractor</h1>
        <p>Paste a URL or upload an HTML/JS file to pull all embedded images.</p>
    </div>

    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Paste game URL here (CORS permitting)...">
        <button onclick="fetchFromUrl()">Fetch URL</button>
    </div>

    <div id="drop-zone">
        <strong>Drag & Drop File</strong> or Click to Upload (.html, .js, .json)
        <input type="file" id="fileInput" hidden accept=".html,.js,.json">
    </div>

    <div class="controls" id="controls">
        <span id="counter">0 images found</span>
        <button id="zip-btn" onclick="downloadAllAsZip()">Download All as .ZIP</button>
    </div>

    <div id="gallery"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('drop-zone');
    const gallery = document.getElementById('gallery');
    const controls = document.getElementById('controls');
    let extractedAssets = [];

    // Setup File Upload
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    // Handle URL Fetch
    async function fetchFromUrl() {
        const url = document.getElementById('urlInput').value;
        if (!url) return alert("Please enter a URL");
        try {
            const response = await fetch(url);
            const text = await response.text();
            processContent(text);
        } catch (err) {
            alert("Error fetching URL. Note: Many sites block this via CORS. Try downloading the HTML file and uploading it here instead.");
        }
    }

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => processContent(e.target.result);
        reader.readAsText(file);
    }

    function processContent(text) {
        gallery.innerHTML = "Scanning...";
        extractedAssets = [];
        
        // Comprehensive regex to catch base64 images and SVG paths
        const base64Regex = /data:image\/([a-zA-Z]*);base64,([^\s"']+)/g;
        let match;
        
        while ((match = base64Regex.exec(text)) !== null) {
            extractedAssets.push({
                type: match[1],
                data: match[0]
            });
        }

        renderGallery();
    }

    function renderGallery() {
        gallery.innerHTML = "";
        if (extractedAssets.length === 0) {
            gallery.innerHTML = "No assets found. Try uploading the game's .js files if the .html is empty.";
            controls.style.display = "none";
            return;
        }

        controls.style.display = "block";
        document.getElementById('counter').innerText = `${extractedAssets.length} images found`;

        extractedAssets.forEach((asset, i) => {
            const div = document.createElement('div');
            div.className = 'asset-card';
            div.innerHTML = `
                <img src="${asset.data}">
                <div>Asset_${i}.png</div>
                <button onclick="downloadSingle('${asset.data}', 'asset_${i}.png')" style="margin-top:5px; padding:5px; font-size:10px;">Save PNG</button>
            `;
            gallery.appendChild(div);
        });
    }

    function downloadSingle(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
    }

    async function downloadAllAsZip() {
        const zip = new JSZip();
        const imgFolder = zip.folder("images");

        extractedAssets.forEach((asset, i) => {
            const base64Data = asset.data.split(',')[1];
            imgFolder.file(`asset_${i}.png`, base64Data, {base64: true});
        });

        const content = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "game_assets.zip";
        link.click();
    }
</script>
</body>
</html>
