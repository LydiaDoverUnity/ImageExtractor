<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Game Asset Extractor</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        .box { background: #222; padding: 20px; border-radius: 10px; max-width: 800px; margin: 0 auto 20px; border: 1px solid #444; }
        input[type="text"] { width: 70%; padding: 12px; background: #000; color: #0f0; border: 1px solid #444; border-radius: 5px; }
        button { padding: 12px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .btn-fetch { background: #007bff; color: white; }
        .btn-zip { background: #28a745; color: white; display: none; margin: 20px auto; }
        #status-log { color: #aaa; font-size: 0.9em; margin: 10px; font-family: monospace; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: #333; padding: 10px; border-radius: 8px; }
        img { width: 100%; height: 100px; object-fit: contain; background: #fff; }
    </style>
</head>
<body>

    <h1>🎮 Asset Deep Extractor</h1>

    <div class="box">
        <input type="text" id="url-input" placeholder="Paste Amazon S3 URL here...">
        <button class="btn-fetch" onclick="startDeepFetch()">Start Fetch</button>
        <div id="status-log">Ready. Paste a link to begin.</div>
    </div>

    <button id="zip-btn" class="btn-zip" onclick="downloadZip()">Download All as .ZIP</button>
    <div id="gallery"></div>

    <script>
        let allImages = [];

        function log(msg) {
            document.getElementById('status-log').innerText = "> " + msg;
            console.log(msg);
        }

        async function startDeepFetch() {
            const url = document.getElementById('url-input').value;
            if (!url) return alert("Please enter a URL");
            
            allImages = [];
            document.getElementById('gallery').innerHTML = "";
            document.getElementById('zip-btn').style.display = "none";

            log("Bypassing CORS and fetching HTML...");
            try {
                // Using puter.net.fetch to bypass browser security
                const response = await puter.net.fetch(url);
                const htmlText = await response.text();
                log("HTML loaded. Scanning for linked scripts...");

                // Find the specific .js files (like the oa673bf0 one)
                const jsRegex = /src=["'](.*?\.(js))["']/g;
                let match;
                const scriptsToFetch = [];
                
                while ((match = jsRegex.exec(htmlText)) !== null) {
                    let scriptUrl = match[1];
                    if (!scriptUrl.startsWith('http')) {
                        // Handle relative paths
                        const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
                        scriptUrl = baseUrl + scriptUrl;
                    }
                    scriptsToFetch.push(scriptUrl);
                }

                log(`Found ${scriptsToFetch.length} scripts. Fetching asset data from them...`);

                // Scan the HTML itself first
                extractFromText(htmlText);

                // Scan every JS file found
                for (let sUrl of scriptsToFetch) {
                    log(`Scanning script: ${sUrl.split('/').pop()}...`);
                    try {
                        const sRes = await puter.net.fetch(sUrl);
                        const sText = await sRes.text();
                        extractFromText(sText);
                    } catch (e) {
                        log(`Failed to load ${sUrl}`);
                    }
                }

                log(`Finished! Found ${allImages.length} images.`);
                if (allImages.length > 0) document.getElementById('zip-btn').style.display = "block";

            } catch (err) {
                log("Error: " + err.message);
                alert("Critical failure. Check console.");
            }
        }

        function extractFromText(text) {
            // Regex to find ANY base64 image string
            const base64Regex = /data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+/g;
            const found = text.match(base64Regex) || [];
            
            found.forEach(str => {
                if (!allImages.includes(str)) {
                    allImages.push(str);
                    renderThumb(str);
                }
            });
        }

        function renderThumb(src) {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<img src="${src}"><br><small>Asset ${allImages.length}</small>`;
            document.getElementById('gallery').appendChild(div);
        }

        async function downloadZip() {
            log("Generating ZIP file...");
            const zip = new JSZip();
            allImages.forEach((img, i) => {
                const data = img.split(',')[1];
                zip.file(`image_${i}.png`, data, {base64: true});
            });
            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "game_assets.zip";
            link.click();
            log("Download started.");
        }
    </script>
</body>
</html>
